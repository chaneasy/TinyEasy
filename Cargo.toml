[package]
name = "tinyeasy"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Compact Tinify image compressor built with Rust and iced"
license = "MIT"

[[bin]]
name = "tinyeasy"
path = "rust/main.rs"

[dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "image-without-codecs", "linux-theme-detection", "tokio", "advanced", "x11", "wayland"] }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "fs", "sync", "io-util", "time", "macros", "net"] }
tokio-util = { version = "=0.7.16", features = ["io"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "=0.3.31"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "=0.10.1"
zeroize = { version = "=1.8.2", features = ["derive"] }
directories = "=6.0.0"
tempfile = "=3.23.0"
walkdir = "=2.5.0"
rfd = "=0.15.4"
open = "=5.3.2"

# Software rendering and image decoding need optimization even during development.
# Keep application debug assertions and QA isolation hooks enabled.
[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
